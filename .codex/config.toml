model = "gpt-6-astra"
model_reasoning_effort = "xhigh"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "xhigh"
interrupt_message = true

[agents.builder]
description = "Astra implementation worker for specifically owned files; no direct experiment execution."
config_file = "agents/builder.toml"

[agents.scholar]
description = "Astra read-only paper, implementation-lead and experiment-design investigation."
config_file = "agents/scholar.toml"

[agents.reviewer]
description = "Astra read-only independent review of a concrete code change or scientific interpretation."
config_file = "agents/reviewer.toml"

